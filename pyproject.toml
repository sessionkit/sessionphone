[project]
name = "sessionphone"
version = "0.4.0"
description = "Ring your Claude Code session from your phone over Delta Chat"
readme = "README.md"
authors = [
    { name = "Mike Bailey", email = "mike@sessionkit.ai" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.1",
    # the agent's Delta Chat account; the server binary ships in the wheel
    "deltachat-rpc-client>=2.61.0",
    "deltachat-rpc-server>=2.61.0",
    "segno>=1.6.6",
]

[project.urls]
Homepage = "https://github.com/sessionkit/sessionphone"
Repository = "https://github.com/sessionkit/sessionphone"

[project.optional-dependencies]
# The media pack: the bot, calls and `sessionphone web` need it;
# setup, qr and link do not, so their first run can leave it out (52.5 MB of
# wheels becomes 10.0 MB on an arm64 Mac). Install with `sessionphone[media]`.
media = [
    # the WebRTC stack calls run on
    "aiortc==1.15.0",
    "aioice==0.10.2",
    "av==17.1.0",
    "numpy>=2",
    # `sessionphone web`: one asyncio server for the page and its
    # WebSocket; the passkey checks verify with cryptography directly (no CBOR)
    "websockets>=16,<17",
    "cryptography>=42",
]

# NO `ears` extra (not decided yet). Ears is ours on PyPI as `sessionvoice`
# (first published 2030-06-09). Never declare the PyPI `ears`: it is someone else's
# package (0.2.10: flask, google-cloud-pubsub). The bot hears a call through the
# STT at DC_STT_URL, not through ears.

[project.scripts]
sessionphone = "sessionphone.cli:main"
# The dc-* tools an install needs on its PATH: every one the README, docs,
# skill or --help text names, which today is every bin/dc-* but dc-env (a
# library the tools source, never run by name). They are bash, and Python
# (dc-log, dc-log-web), so each is a console script with ONE target,
# sessionphone.dctools:main: it reads the name it was run as and execs the
# real tool, shipped as package data in src/sessionphone/dcbin/ beside its
# dc-env, with DC_PYTHON naming its own interpreter (PHONE-314).
# They were wheel DATA scripts (PHONE-150/290). `uv tool install X` links
# only X's own executables, never a dependency's, and a data script cannot be
# re-exported, so on a kit install (sessionphone is a dependency there) none
# reached the PATH. Console scripts can be re-exported: the kit must
# RE-DECLARE every dc-* line below in its own [project.scripts], as it does
# for every other child command (the companion kit change, PHONE-314).
# dcbin/ is the ALLOW-LIST: one relative symlink into bin/ per tool, which
# uv_build follows, so a wheel ships bin/'s own bytes (mode 0755) and a new
# bin/ tool joins it only by a link someone adds. bin/sessionphone and
# bin/bridge-check never ship. tests/test_wheel_dc_tools.py holds the
# shipped set exact (these lines and dcbin/), and fails when the user-facing
# text names a tool not shipped.
dc-answer = "sessionphone.dctools:main"
dc-call = "sessionphone.dctools:main"
dc-call-mix = "sessionphone.dctools:main"
dc-delete = "sessionphone.dctools:main"
dc-dm = "sessionphone.dctools:main"
dc-fetch = "sessionphone.dctools:main"
dc-hangup = "sessionphone.dctools:main"
dc-invite = "sessionphone.dctools:main"
dc-live = "sessionphone.dctools:main"
dc-log = "sessionphone.dctools:main"
dc-log-web = "sessionphone.dctools:main"
dc-react = "sessionphone.dctools:main"
dc-ring = "sessionphone.dctools:main"
dc-say = "sessionphone.dctools:main"
dc-send-file = "sessionphone.dctools:main"
dc-xdc-realtime = "sessionphone.dctools:main"
dc-xdc-update = "sessionphone.dctools:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # developers keep the whole stack: `uv sync`, `make test` and
    # bin/bridge-check get the media pack too
    "sessionphone[media]",
    # let the QR test decode its own output (tests/test_qr_svg.py)
    "zxing-cpp",
    "pillow",
]

[tool.ruff]
# The bridge and its script-tests were written under no linter
# (158 findings when first measured). bin/bridge-check gates them instead:
# compile, import, and every bridge test.
extend-exclude = ["src/sessionphone/bridge", "tests/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/bridge/ are mostly script-style (asserts at module level); bin/bridge-check
# runs them, and runs the pytest-style ones under pytest. `make check` runs it.
addopts = "--ignore=tests/bridge"
